name: Export source snapshot

on:
  push:
    branches:
      - loop/precision-bug-hunting-protocol

permissions:
  contents: read

jobs:
  export:
    if: "github.event.head_commit.message == 'tooling: upload source artifact'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build compact source archive
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=docs/images \
            --exclude=.bug-hunter \
            --exclude=tmp \
            --exclude=.loop/source-snapshot.tgz.b64 \
            --exclude=.loop/source-snapshot.part-* \
            --exclude=.loop/source-snapshot.parts \
            --exclude=.loop/source-snapshot.sha256 \
            -czf /tmp/bug-hunter-source.tgz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: bug-hunter-source-snapshot
          path: /tmp/bug-hunter-source.tgz
          if-no-files-found: error
          retention-days: 1
