name: Export source snapshot

on:
  push:
    branches:
      - loop/precision-bug-hunting-protocol

permissions:
  contents: read

jobs:
  export:
    if: "github.event.head_commit.message == 'tooling: upload dependencies'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle dependencies
        run: tar -czf /tmp/bug-hunter-node-modules.tgz node_modules

      - name: Upload dependency archive
        uses: actions/upload-artifact@v4
        with:
          name: bug-hunter-node-modules
          path: /tmp/bug-hunter-node-modules.tgz
          if-no-files-found: error
          retention-days: 1
