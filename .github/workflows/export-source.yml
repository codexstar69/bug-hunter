name: Export source snapshot

on:
  push:
    branches:
      - loop/precision-bug-hunting-protocol

permissions:
  contents: write

jobs:
  export:
    if: "github.event.head_commit.message == 'tooling: export source snapshot'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build compact source archive
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=docs/images \
            --exclude=.bug-hunter \
            --exclude=tmp \
            -czf /tmp/bug-hunter-source.tgz .
          base64 -w 0 /tmp/bug-hunter-source.tgz > .loop/source-snapshot.tgz.b64
          sha256sum /tmp/bug-hunter-source.tgz | awk '{print $1}' > .loop/source-snapshot.sha256

      - name: Commit transport snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .loop/source-snapshot.tgz.b64 .loop/source-snapshot.sha256
          git commit -m 'tooling: source snapshot'
          git push origin HEAD:loop/precision-bug-hunting-protocol
