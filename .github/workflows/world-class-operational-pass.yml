test('atomic chunk commit revalidates an exact-cache sibling after worker execution', async () => {
  const sandbox = makeSandbox('persisted-cache-sibling-');
  const skillDir = path.resolve(__dirname, '..', '..');
  const stateScript = resolveSkillScript('bug-hunter-state.cjs');
  const cachedFile = path.join(sandbox, 'cached.js');
  const scanFile = path.join(sandbox, 'scan.js');
  const filesPath = path.join(sandbox, 'files.json');
  const cachedFilesPath = path.join(sandbox, 'cached-files.json');
  const statePath = path.join(sandbox, '.bug-hunter', 'state.json');
  const workerPath = path.join(sandbox, 'worker.cjs');

  fs.writeFileSync(cachedFile, 'export const cached = 1;\n', 'utf8');
  fs.writeFileSync(scanFile, 'export const scan = 1;\n', 'utf8');
  writeJson(filesPath, [cachedFile, scanFile]);
  writeJson(cachedFilesPath, [cachedFile]);

  runJson('node', [
    stateScript,
    'init',
    statePath,
    'scaled',
    filesPath,
    '2',
    '48000',
    'true'
  ], { cwd: sandbox });
  runJson('node', [stateScript, 'hash-update', statePath, cachedFilesPath, 'scanned'], {
    cwd: sandbox
  });

  writeWorker(workerPath, [
    "const fs = require('node:fs');",
    "const args = process.argv;",
    "const output = args[args.indexOf('--findings-json') + 1];",
    "fs.writeFileSync(output, '[]\\n', 'utf8');",
    `fs.appendFileSync(${JSON.stringify(cachedFile)}, 'export const drift = 2;\\n', 'utf8');`
  ]);

  await processPendingChunks({
    statePath,
    stateScript,
    chunksDir: path.join(sandbox, '.bug-hunter', 'chunks'),
    journalPath: path.join(sandbox, '.bug-hunter', 'run.log'),
    workerCmdTemplate: `node ${shellQuote(workerPath)} --findings-json {findingsJson}`,
    timeoutMs: 5000,
    maxOutputBytes: 100000,
    killGraceMs: 100,
    maxRetries: 0,
    backoffMs: 0,
    failFast: false,
    backend: 'local-sequential',
    mode: 'scaled',
    skillDir,
    index: null,
    confidenceThreshold: 75
  });

  const state = readJson(statePath);
  assert.equal(state.chunks[0].status, 'failed');
  assert.equal(state.fileStates[cachedFile].status, 'failed');
  assert.match(state.chunks[0].lastError, /changed|integrity/i);
  assert.equal(state.bugLedger.length, 0);
});

