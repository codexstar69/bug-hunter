name: Apply world-class operational hardening

on:
  push:
    branches:
      - chore/world-class-freshness-pass

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/world-class-freshness-pass
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Apply runtime, mode, and regression hardening
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          files = {
            'modes/persisted-chunks.md': r'''# Persisted Chunk Execution Contract

Use this contract from extended, scaled, local-sequential, or oversized-domain
execution whenever the assigned source cannot be completed in one bounded
Hunter pass.

The objective is not merely to remember a queue. It is to ensure that assigned
source, findings, fact cards, hashes, coverage, and completion state advance as
one integrity-controlled transaction.

## Preferred path: composition runner

When the selected backend can provide a real worker command template, prefer:

```bash
node "$SKILL_DIR/scripts/run-bug-hunter.cjs" run \
  --skill-dir "$SKILL_DIR" \
  --files-json ".bug-hunter/source-files.json" \
  --worker-cmd "<command that writes {findingsJson}>" \
  --mode "<extended|scaled|local-sequential|large-codebase>"
```

The worker template must consume the declared placeholders and write the
canonical findings artifact. There is no no-op worker. The runner owns adaptive
planning, token-bounded chunks, retrieval context, exact evidence-cache reuse,
retries, journaling, source-integrity checks, coverage, and persisted identity.

## Manual fallback

Use this only when the current agent must perform each Hunter assignment itself.
Mirror the deterministic scheduler rather than inventing a parallel state path.

### 1. Freeze the ordered source queue

Write canonical repository-contained source paths to
`.bug-hunter/source-files.json` in deterministic risk order. Do not alphabetize
the list after triage.

Generate an inspectable plan with the effective source-token budget:

```bash
node "$SKILL_DIR/scripts/run-bug-hunter.cjs" plan \
  --skill-dir "$SKILL_DIR" \
  --files-json ".bug-hunter/source-files.json" \
  --mode "<mode>" \
  --max-source-tokens "$MAX_SOURCE_TOKENS" \
  --plan-path ".bug-hunter/chunk-plan.json"
```

Initialize state with the same effective maximum files and token budget:

```bash
node "$SKILL_DIR/scripts/bug-hunter-state.cjs" init \
  ".bug-hunter/state.json" \
  "<mode>" \
  ".bug-hunter/source-files.json" \
  "$MAX_FILES_PER_CHUNK" \
  "$MAX_SOURCE_TOKENS" \
  true
```

An explicit caller-provided fixed chunk size may intentionally disable token
budget enforcement. Otherwise keep it enabled.

### 2. Prepare one exact assignment

For each `next-chunk` result:

1. Write the chunk's exact `files` array to
   `.bug-hunter/chunks/<chunk-id>-files.json`.
2. Run `hash-filter` on that full array.
3. If `changed`, `missing`, or `unreadable` is non-empty, mark the chunk failed,
   preserve the diagnostic state, and do not dispatch.
4. Treat the returned `scan` array as the only files the Hunter may report.
   Write it to `.bug-hunter/chunks/<chunk-id>-scan-files.json`.

```bash
node "$SKILL_DIR/scripts/bug-hunter-state.cjs" hash-filter \
  ".bug-hunter/state.json" \
  ".bug-hunter/chunks/<chunk-id>-files.json"
```

### 3. Commit through the atomic integrity gate

Mark the chunk `in_progress` immediately before analysis. Use a fresh attempt
path for every retry and remove stale findings/fact-card output before another
attempt.

The Hunter reads only the `scan` files and writes a schema-valid findings array.
Write a fact card containing `apiContracts`, `authAssumptions`, and `invariants`
arrays. Validate findings before committing.

```bash
node "$SKILL_DIR/scripts/schema-validate.cjs" findings \
  ".bug-hunter/chunks/<chunk-id>-findings.json"

node "$SKILL_DIR/scripts/bug-hunter-state.cjs" commit-chunk \
  ".bug-hunter/state.json" \
  "<chunk-id>" \
  ".bug-hunter/chunks/<chunk-id>-scan-files.json" \
  ".bug-hunter/chunks/<chunk-id>-findings.json" \
  ".bug-hunter/chunks/<chunk-id>-facts.json" \
  "$EFFECTIVE_CONFIDENCE_THRESHOLD" \
  "<mode>"
```

`commit-chunk` restricts findings to the scan list but revalidates the complete
parent chunk, including exact-cache siblings, before any findings or completion
state become durable. A source change therefore fails the chunk even when the
changed file was initially eligible for hash-cache reuse.

When `scan` is empty, write `[]` findings plus an empty fact card and still use
`commit-chunk`. Do not mark an all-cache-hit chunk done through an unchecked
shortcut.

Never replace this transaction with `record-findings` followed by
`mark-chunk ... done`; that separates evidence from source-integrity proof.

### 4. Finish canonical artifacts

After the queue reaches terminal state:

- map the state ledger back to the canonical findings schema and validate
  `.bug-hunter/hunter-findings.json`;
- derive `.bug-hunter/coverage.json` from per-file state, not parent chunk state;
- keep failed/pending files visible;
- run Skeptic and Referee for non-empty findings;
- for an empty findings array, write and validate empty canonical
  `.bug-hunter/skeptic.json` and `.bug-hunter/referee.json` arrays;
- build the joined scan report and its rendered Markdown view.

A failed chunk, missing required artifact, or unresolved required verification
prevents a clean or writable result.
''',
            'modes/single-file.md': r'''# Single-File Mode

Use this mode for exactly one validated source file. Recon is normally omitted
because the assignment already supplies the complete source boundary.

## Hunter

Dispatch Hunter through `modes/dispatch.md` with exactly the canonical target
file, optional bounded documentation/retrieval context, and no mutation
authority. Validate `.bug-hunter/hunter-findings.json` immediately.

A finding for any other file is a failed assignment, not an invitation to widen
scope.

## Empty finding path

When Hunter returns `[]`, do not leave downstream canonical artifacts missing.
Write and validate empty arrays for:

```text
.bug-hunter/skeptic.json
.bug-hunter/referee.json
```

Then build `scan-report.json` and `report.md`. A zero-finding result is clean only
when the file was actually read, source integrity remained current, and every
required verification check succeeded.

## Adversarial review

For non-empty findings:

1. Dispatch Skeptic through `modes/dispatch.md` using only those bug IDs and the
   exact referenced source needed to challenge them.
2. Validate `.bug-hunter/skeptic.json`.
3. Dispatch Referee with the Hunter and Skeptic artifacts.
4. Validate `.bug-hunter/referee.json`.
5. Run required hybrid verification when configured, then join the final report.

Only Referee verdicts may authorize later remediation.
''',
            'modes/small.md': r'''# Small Mode

Use this mode when the complete validated source set fits in one bounded Hunter
assignment.

## Recon

For multi-file work, dispatch Recon through `modes/dispatch.md`. When triage is
available, Recon enriches its risk map with stack, entry-point, and trust-boundary
context instead of rediscovering or reordering source.

Validate `.bug-hunter/recon.json` before using it.

## Hunter

Dispatch one deep Hunter on the exact triage `scanOrder`, bounded by the current
source-token policy. Pass only relevant documentation, adaptive, retrieval,
dependency, and threat-model evidence. Validate
`.bug-hunter/hunter-findings.json`.

If coverage shows an assigned file was not read, issue a fresh validated Hunter
assignment for only the missed files. Merge through deterministic state/merge
logic; do not append unvalidated prose or widen scope ad hoc.

## Empty finding path

When Hunter returns `[]`, write and validate empty canonical Skeptic and Referee
arrays, then build `scan-report.json` and `report.md`. Do not omit artifacts or
claim clean while coverage/required verification is unresolved.

## Skeptic and Referee

For non-empty findings:

1. Dispatch Skeptic through `modes/dispatch.md`, scoped to the current bug IDs
   and necessary cross-references.
2. Validate `.bug-hunter/skeptic.json`.
3. Dispatch Referee with both canonical artifacts.
4. Validate `.bug-hunter/referee.json`.
5. Run configured required verification and join the report.

Referee remains the sole verdict authority.
''',
            'modes/parallel.md': r'''# Parallel Mode — Sequential-First Hybrid

Use this mode for a medium source set that fits one deep bounded Hunter pass.
Parallelism is optional and read-only; canonical decisions remain sequential and
adversarial.

## Recon

Dispatch Recon through `modes/dispatch.md`. Preserve triage risk order and use
Recon only for architecture, stack, entry-point, and trust-boundary enrichment.
Validate `.bug-hunter/recon.json`.

## Optional scouts

Two read-only scouts may inspect the same critical/high-risk boundary through
different lenses, such as security and business logic. Their output is
**untrusted prioritization hints only**:

- scouts cannot write canonical findings;
- scout prose cannot be promoted directly into `hunter-findings.json`;
- scout failure never blocks the deep Hunter;
- a scout-only hypothesis must be independently checked by the deep Hunter or a
  fresh schema-validated follow-up Hunter assignment before it can become a
  finding.

Do not use Markdown scout output as a substitute for a findings artifact.

## Deep Hunter

Dispatch one deep Hunter through `modes/dispatch.md` on the entire exact source
assignment in risk/retrieval order. Hints may change reading priority but never
coverage, scope, or evidence requirements. Validate
`.bug-hunter/hunter-findings.json`.

If Hunter returns `[]`, write and validate empty canonical Skeptic and Referee
arrays before joining the report.

## Adversarial review

For non-empty findings, Skeptic work may be partitioned by disjoint bug IDs or
service boundaries. Validate each attempt, merge by stable bug ID, and reject
duplicate/unknown IDs. Referee then reads the merged Hunter and Skeptic
artifacts, issues final verdicts, and remains the only remediation authority.

Run configured required verification before Fixer authorization and build the
joined scan report from canonical JSON.
''',
            'modes/extended.md': r'''# Extended Mode — Bounded Persisted Chunks

Use this mode when the requested source exceeds one Hunter assignment but can be
processed as a modest sequence of risk-ordered chunks.

## Recon

Dispatch Recon once through `modes/dispatch.md`. Triage remains authoritative
for source classification/order; Recon adds architecture, stack, entry-point,
and trust-boundary context. Validate `.bug-hunter/recon.json`.

## Hunter chunks

Follow `modes/persisted-chunks.md` exactly. Prefer the composition runner with a
real worker command. The manual fallback must use token-bounded planning,
`hash-filter`, fresh attempt outputs, and atomic `commit-chunk` state promotion.

Do not use a fixed file count such as 30 unless the caller explicitly requested
that override. Do not use `record-findings` plus `mark-chunk ... done` as a
replacement for the atomic integrity gate.

## Review and report

After all chunks reach terminal state, validate the merged
`.bug-hunter/hunter-findings.json`.

- Non-empty findings go through scoped Skeptic review and one final Referee
  decision layer.
- Empty findings still produce validated empty Skeptic and Referee arrays.
- Failed chunks remain failed coverage and block a clean/writable result.
- Configured required verification runs before any Fixer authorization.

Join canonical JSON into `scan-report.json` and render `report.md`.
''',
            'modes/scaled.md': r'''# Scaled Mode — Resumable Persisted Chunks

Use this mode for a larger queue requiring multiple bounded chunks, exact run
identity, and safe resume.

## Recon and planning

Dispatch Recon once through `modes/dispatch.md` for architecture/trust-boundary
enrichment. Keep triage source order authoritative. Generate adaptive/retrieval
plans when the runner is used and persist them as part of run identity.

## Resumable execution

Follow `modes/persisted-chunks.md`. Prefer `run-bug-hunter.cjs run`, which binds
state to repository root, base commit, source scope, effective options, and
stable adaptive/retrieval inputs.

On resume:

- require the exact requested run ID;
- preserve the original source baseline;
- reject changed/missing/unreadable source before launching another worker;
- skip only exact-hash evidence;
- use fresh attempt output for every retry;
- keep failed chunks and per-file coverage visible.

Never rebuild a new baseline from changed source under an old run ID.

## Consistency, review, and report

After chunk completion, use deterministic conflict detection/merge logic. Keep
stable bug IDs and strongest evidence; union useful cross-references/security
metadata.

Non-empty findings go through scoped Skeptic review and final Referee verdicts.
Empty findings still produce validated empty Skeptic and Referee arrays.
Required verification failure blocks Fixer authorization. Join the final report
from canonical JSON and derive coverage from per-file state.
''',
            'modes/local-sequential.md': r'''# Local-Sequential Mode

Local-sequential is a complete backend, not a degraded fallback. One
orchestrating agent performs Recon, Hunter, Skeptic, and Referee in sequence,
writing canonical artifacts between roles so prior reasoning does not substitute
for current source evidence.

## 1. Recon

Read `skills/recon/SKILL.md` only when Recon is needed. Triage remains
authoritative for source classification, risk order, and budget. Recon enriches
stack, entry points, trust boundaries, and architecture, then writes and
validates `.bug-hunter/recon.json`.

## 2. Hunter

Read `skills/hunter/SKILL.md` and claim-driven documentation guidance. Load
calibration examples only for ambiguous/lower-confidence cases.

For a one-pass source set, read every assigned production file in deterministic
risk/retrieval order and write a schema-valid
`.bug-hunter/hunter-findings.json`.

When the source set exceeds one bounded assignment, follow
`modes/persisted-chunks.md`. Never use the legacy `record-findings` then
`mark-chunk done` sequence; use atomic `commit-chunk` so source hashes,
findings, facts, and completion advance together.

## 3. Empty finding path

When Hunter returns `[]`, write and validate empty canonical
`.bug-hunter/skeptic.json` and `.bug-hunter/referee.json` arrays. Continue to the
joined scan report rather than treating missing downstream artifacts as success.

## 4. Skeptic

For non-empty findings, read `skills/skeptic/SKILL.md`, re-read current source
and required cross-references, and write `.bug-hunter/skeptic.json`. Do not judge
from Hunter memory. Load examples only when they materially help an unsettled
case. Validate the artifact.

## 5. Referee

Read `skills/referee/SKILL.md`, re-read the strongest/disputed evidence, and
write `.bug-hunter/referee.json`. Referee owns the only final verdict. Missing
or invalid review leaves findings unresolved and non-writable.

## 6. Verification and report

Run bounded hybrid verification when supplied/required. Required failure blocks
Fixer authorization. Build `.bug-hunter/scan-report.json` from canonical Hunter
and Referee artifacts and render `.bug-hunter/report.md`.

Coverage comes from actual per-file state. In single-pass mode, report remaining
queued files honestly. In explicit loop mode, continue through the loop contract
until every queued file is done or a visible hard blocker ends the run.
''',
            'modes/loop.md': r'''# Ralph Loop Mode (`--loop`)

This file is for runtimes with `ralph_start` and `ralph_done`. Other runtimes
must use `modes/loop-generic.md`.

Loop mode is active only when the caller explicitly supplies `--loop`. It
changes queued-coverage completion behavior and grants no mutation or commit
authority.

## Initialize one queue-scaled loop

Compute one cap and use the same value for both the outer driver and experiment
ledger:

```text
MAX_LOOP_ITERATIONS = max(
  12,
  min(200, ceil(SCANNABLE_FILES / max(FILE_BUDGET, 1)) + 8)
)
```

Initialize experiment state before `ralph_start`:

```bash
node "$SKILL_DIR/scripts/experiment-loop.cjs" init \
  .bug-hunter/experiment.jsonl \
  "bug-hunt-$(date +%Y%m%d)" \
  bugs_confirmed \
  higher \
  count \
  --max-iterations "$MAX_LOOP_ITERATIONS"
```

Then call:

```text
ralph_start({
  name: "bug-hunter-audit",
  taskContent: <validated coverage task>,
  maxIterations: MAX_LOOP_ITERATIONS
})
```

Do not initialize a second hard-coded cap inside the same loop.

## Per-iteration gate

Before every iteration, including a resumed one:

```bash
node "$SKILL_DIR/scripts/experiment-loop.cjs" check-continue \
  .bug-hunter/experiment.jsonl \
  --stop-file .bug-hunter/experiment.stop
```

Obey `continue:false`. After a context-limit resume, call `record-resume` only
after this gate succeeds.

Validate `.bug-hunter/coverage.json`. Its lowercase per-file states are
`pending`, `in_progress`, `done`, and `failed`; Markdown is a derived view.

For each iteration:

1. Select the next risk-ordered `pending` assignment. Retry a `failed` file only
   after its recorded blocker has actually been repaired/requeued.
2. Run one complete bounded Hunter/Skeptic/Referee iteration on that assignment.
3. Update coverage from per-file evidence, validate it, and render
   `coverage.md`.
4. Log `keep`, `discard`, or `crash` to the experiment ledger with a stable set
   of secondary metrics. Experiment auto-commit remains false unless separately
   authorized with exact allowed paths.
5. If files remain, call `ralph_done`.

## Completion and blockers

Set coverage status `COMPLETE` and output `<promise>COMPLETE</promise>` only when
every queued file is `done` and required review/verification artifacts are
valid.

When a hard blocker leaves files `failed`, keep coverage `IN_PROGRESS`, render a
final partial report naming the blocker, create the stop signal, and end the
outer loop without claiming clean/full coverage. Do not burn iterations retrying
an unchanged failure.

Users may stop through the runtime interrupt or:

```bash
node "$SKILL_DIR/scripts/experiment-loop.cjs" stop
```

A stale stop file must be cleared explicitly before a future resume.
''',
            'modes/loop-generic.md': r'''# Generic Loop Mode (non-Ralph runtimes)

Use this contract only when `LOOP_MODE=true` and the runtime has no
`ralph_start`/`ralph_done`. The agent drives bounded iterations itself while
`experiment-loop.cjs` provides stop, crash, resume, and iteration guards.

## Setup

Use the same queue-scaled cap as the canonical loop contract:

```text
MAX_LOOP_ITERATIONS = max(
  12,
  min(200, ceil(SCANNABLE_FILES / max(FILE_BUDGET, 1)) + 8)
)
```

```bash
node "$SKILL_DIR/scripts/experiment-loop.cjs" init \
  .bug-hunter/experiment.jsonl \
  "bug-hunt-$(date +%Y%m%d)" \
  bugs_confirmed \
  higher \
  count \
  --max-iterations "$MAX_LOOP_ITERATIONS"
```

Do not replace the computed cap with a second default of 10.

## Iteration protocol

Before every iteration:

```bash
node "$SKILL_DIR/scripts/experiment-loop.cjs" check-continue \
  .bug-hunter/experiment.jsonl \
  --stop-file .bug-hunter/experiment.stop
```

If `continue` is false, stop and report its reason. For a resumed run, call
`record-resume` only after `check-continue` succeeds.

Use `.bug-hunter/coverage.json` as the canonical completion view:

1. Validate it when present.
2. Select the next risk-ordered file entries with status `pending`.
3. Retry `failed` entries only after their recorded cause is repaired and the
   queue is explicitly requeued.
4. Run one complete bounded pipeline iteration.
5. Derive/update coverage from per-file state and render `coverage.md`.
6. Log the iteration as `keep`, `discard`, or `crash` with stable secondary
   metrics and `--auto-commit false` unless exact commit authority exists.

Do not infer completion from a parent chunk or a prose checklist.

## Completion

The loop succeeds only when every queued file is lowercase `done`, required
review/verification artifacts validate, and coverage status is `COMPLETE`.

If a hard blocker leaves `failed` files, stop with coverage `IN_PROGRESS` and a
partial report. Do not call the requested scope clean and do not repeatedly
retry an unchanged failure until the cap is exhausted.

The user can stop future iterations with:

```bash
node "$SKILL_DIR/scripts/experiment-loop.cjs" stop
```
''',
            'modes/fix-loop.md': r'''# Fix Loop Mode (`--loop` with fixing authority)

Use this mode only when loop coverage and a fixing mode are both explicit.
Loop authority does not broaden the immutable Fixer scope and commit permission
remains separate.

Ralph runtimes use `ralph_start`/`ralph_done`; other runtimes combine this file
with `modes/loop-generic.md`.

## Queue-scaled cap

Compute one cap for discovery plus executable remediation work:

```text
MAX_FIX_LOOP_ITERATIONS = max(
  15,
  min(250,
    ceil(SCANNABLE_FILES / max(FILE_BUDGET, 1))
    + EXECUTABLE_FIX_COUNT
    + 8
  )
)
```

Use that same cap for the experiment ledger and outer driver. Do not introduce a
second hard-coded maximum.

## Canonical state

Read and validate:

- `.bug-hunter/coverage.json` for per-file `pending|in_progress|done|failed`;
- `.bug-hunter/fix-plan.json` for executable canary/rollout entries;
- `.bug-hunter/fixer-scope.json` for immutable bug/file authority;
- `.bug-hunter/fix-report.json` for current fix outcomes.

`manual-review`, `larger-refactor`, `architectural-remediation`, conflicting,
and report-only findings are non-executable terminal review work. They remain
visible but are never retried merely to make every confirmed finding read
`FIXED`.

Executable outcomes are terminal when they are one of:

```text
FIXED
FIX_REVERTED
FIX_FAILED
PARTIAL
SKIPPED
FIXER_BUG
```

A terminal failure may require human work, but automatic looping must not repeat
it without new evidence and a newly authorized plan.

## Per iteration

1. Run the loop `check-continue` gate.
2. Process the next risk-ordered pending discovery assignment through Hunter,
   Skeptic, Referee, and required verification.
3. Rebuild/validate strategy, plan, and immutable Fixer scope when new confirmed
   findings appear.
4. Execute only pending canary/rollout entries from the validated scope through
   `modes/fix-pipeline.md`, one writer at a time.
5. Update/validate coverage and fix report; render human views.
6. Log the iteration, preserving stable metrics.

The discovery checklist covers **Critical, High, Medium, and Low** queued source.
Fix execution remains confidence/remediation gated regardless of severity.

## Completion

End the loop when:

- every queued source file is `done`, or a visible hard blocker has been
  reported; and
- every executable Fixer entry has a terminal outcome; and
- no required review/verification artifact is missing.

`MANUAL_REVIEW` does not keep the automatic loop alive. It prevents a clean or
fully remediated claim and must be surfaced in the final report.

Output `<promise>COMPLETE</promise>` only as the driver completion signal after
the final report accurately distinguishes fixed, reverted, failed, partial,
skipped, Fixer-bug, and manual-review work. Never translate that signal into a
claim that all bugs were fixed.
''',
            'modes/large-codebase.md': r'''# Large-Codebase Mode — Domain-Scoped Evidence

Use this mode when deterministic triage shows that one coherent repository scan
would exceed bounded context. Large-codebase mode changes partitioning, not
permissions: scan-only and single-pass remain the defaults unless `--loop` or a
fixing mode is explicit.

## 1. Domain map

Prefer `.bug-hunter/triage.json` and its `domains`, `domainFileLists`,
`scanOrder`, risk counts, and token estimates. Do not redo filesystem discovery
or maintain a second extension allowlist when triage is available.

When triage is unavailable, build a structural domain map using the maintained
source classifier and write `.bug-hunter/domain-map.json`. Treat it as planning
input, not evidence of scanned source.

## 2. Select bounded work

Process domains in deterministic risk order: Critical, High, Medium, then Low.

- In single-pass mode, execute only the bounded highest-priority domain/chunk
  set and report every remaining domain as pending coverage.
- With explicit `--loop`, continue domain and boundary assignments until they
  are done or a visible hard blocker stops the queue.

For a domain that exceeds one Hunter assignment, follow
`modes/persisted-chunks.md` inside that domain. Never mix unrelated domains just
to fill a file-count target.

## 3. Domain pipeline

For each selected domain, write canonical artifacts under a stable directory:

```text
.bug-hunter/domains/<domain-id>/recon.json
.bug-hunter/domains/<domain-id>/hunter-findings.json
.bug-hunter/domains/<domain-id>/skeptic.json
.bug-hunter/domains/<domain-id>/referee.json
.bug-hunter/domains/<domain-id>/coverage.json
```

Run Recon, Hunter, Skeptic, and Referee with `modes/dispatch.md`. Empty findings
still produce validated empty Skeptic and Referee arrays. State and source hashes
must remain repository-contained and exact.

## 4. Boundary audit

After relevant domains are complete, identify cross-domain callers/callees using
`code-index.cjs` when available and explicit import/route/message evidence
otherwise. Build focused boundary assignments containing both sides of a named
contract or trust boundary.

Use hypothesis-directed retrieval and hard budgets. Boundary findings must still
come from a schema-valid Hunter assignment and survive Skeptic/Referee review;
index edges or scout hints alone are not findings.

Write boundary artifacts under `.bug-hunter/domains/_boundaries/<boundary-id>/`.

## 5. Merge without identity loss

Merge canonical domain and boundary findings through deterministic state logic:

- preserve stable bug IDs;
- deterministically disambiguate genuine ID collisions;
- deduplicate by evidence identity rather than blind renumbering;
- preserve strongest evidence and union useful cross-references/security
  metadata;
- reject unknown/duplicate verdict IDs.

Do not globally renumber IDs after Skeptic/Referee artifacts already reference
them.

## 6. Coverage and resume

Persist run identity, domain/chunk status, exact source hashes, and per-file
coverage. A domain marked done cannot manufacture completion for pending files.
Resume only the matching repository/base/scope/options identity and reject source
drift before dispatch.

Delta selection is an internal runner integration, not a separate undocumented
public skill flag. Changed-domain scans must still include dependency/dependent
and boundary expansion needed for the named hypotheses.

## 7. Final report

Join domain and boundary verdicts into the canonical repository
`scan-report.json`, render `report.md`, and include a per-domain coverage table.
Required hybrid verification failure blocks Fixer authorization.

Never claim full coverage while any requested domain/file is pending or failed.
''',
            'modes/fix-pipeline.md': r'''# Phase 2: Authorized Fix Pipeline

Run this phase only when fixing authority is explicit and at least one
Referee-confirmed finding has an executable entry in the validated fix plan.
Hunter findings alone never authorize edits.

## 1. Preconditions

Before any mutation:

1. Validate `hunter-findings.json`, `referee.json`, `fix-strategy.json`,
   `fix-plan.json`, and `fixer-scope.json`.
2. Admit only `REAL_BUG` verdicts classified `safe-autofix` and meeting the
   **effective** confidence policy. Use `EFFECTIVE_CONFIDENCE_THRESHOLD` from an
   explicit caller setting or the stable adaptive plan; do not hard-code 75 when
   another validated threshold applies.
3. Exclude manual-review, larger-refactor, architectural-remediation,
   conflicting, report-only, and unreviewed work from executable canary/rollout
   stages.
4. If required hybrid verification failed, timed out, or was unavailable, stop
   before Fixer authorization.
5. Bind immutable scope to canonical repository root, base commit, run ID,
   approved bug IDs, and approved real file paths.

`--plan` stops after validated strategy/plan output.

## 2. Preview/dry-run

When `DRY_RUN_MODE=true`:

- do not create/switch branches;
- do not acquire the writer lock;
- do not edit, stage, commit, stash, or restore source;
- produce only validated plan/preview and a `dry_run:true` fix report.

A preview is not an applied patch and must not be reported as fixed.

## 3. Git and preservation boundary

Actual fixing requires a Git worktree with a trustworthy base commit.

Record original branch/HEAD and inspect tracked, staged, untracked, ignored, and
existing-stash state before changing anything. Create a dedicated fix branch
only after the current state can be preserved. If preservation, branch creation,
status inspection, or base capture fails, stop Phase 2.

When pre-existing tracked/staged changes must be stashed, record the exact stash
reference. Never discard it and never pop a stash onto a branch different from
the branch it came from.

- If all fixes are commit-backed, return to the original branch before
  attempting automatic stash restoration; keep the fix branch for review.
- If fixes remain uncommitted, do not switch branches or pop the stash. Leave
  both intact and report exact recovery steps.
- Untracked files and pre-existing stashes require explicit preservation proof;
  do not promise automatic restoration when it is unavailable.

## 4. Single-writer lock and isolation

Acquire `.bug-hunter/fix.lock`, retain its owner token, renew it after each
attempt/batch, and release it in best-effort final cleanup on every exit path.
Do not steal a lock from a live owner.

Use Bug Hunter-managed worktree isolation only when the selected backend and
caller permissions support its full prepare/identity/harvest/cleanup contract.
If requested isolation fails, preserve the worktree and stop that batch; never
fall back silently to direct edits.

One Fixer writes at a time. Analysis/review roles remain read-only.

## 5. Baseline and plan

Detect available test, typecheck, build, static, and targeted verification
commands. Run the test baseline twice when practical:

- failures present in both runs are pre-existing;
- failures present in only one run are flaky;
- missing verification remains an explicit warning, not a pass.

Build canary and rollout stages from immutable executable entries. Order by
dependency where proven, then severity/confidence/stable identity. Keep batches
small and same-file work coherent.

The canonical `fix-plan.json`, not a prose percentage rule, is authoritative for
which entries are canary or rollout in a specific run.

## 6. Execute canary then rollout

For each immutable-scope entry/batch:

1. Check global deadline, circuit breaker, writer-lock ownership, and source/base
   identity.
2. Validate the Fixer payload.
3. Dispatch `skills/fixer/SKILL.md` through `modes/dispatch.md` with only the
   approved bug IDs/files and current verification context.
4. Reject changes outside allowed real paths, Git metadata, symlink/submodule
   boundaries, or unrelated files.
5. Run the smallest impacted check before proceeding.
6. Record a checkpoint only when commit permission is explicit. Stage exact
   approved paths; never use `git add -A`.
7. Renew the lock.

Canary failure blocks rollout. A failure rate above the configured circuit
breaker threshold or the Phase 2 deadline marks remaining executable entries
`SKIPPED` with a reason and stops further mutation.

## 7. Verification and rollback

After checkpoints, run targeted checks and then available full tests, typecheck,
build, static, or configured hybrid checks. Compare against the two-run baseline
and ignore only identified flaky/pre-existing failures.

Automatic per-bug rollback is permitted only with a commit-backed checkpoint.
If commit authority was not granted and an uncommitted patch introduces a
regression, stop further edits, mark the entry `FIX_FAILED`, preserve the diff,
and report manual restoration steps rather than claiming automatic rollback.

After remediation, perform a targeted Hunter review of changed hunks. A new
Medium-or-higher defect becomes `FIXER_BUG`; lower-impact notes remain visible
without being mislabeled as a successful fix.

## 8. Final statuses

Use these user-facing outcomes consistently:

| Status | Meaning |
|---|---|
| `FIXED` | Patch applied and verification found no new failure |
| `FIX_REVERTED` | Commit-backed patch regressed and was cleanly reverted |
| `FIX_FAILED` | Patch/verification/rollback could not be completed safely |
| `PARTIAL` | Bounded patch landed but wider work remains |
| `SKIPPED` | Not attempted because of authority, deadline, circuit breaker, or blocker |
| `FIXER_BUG` | Post-fix review found a new Medium-or-higher defect |
| `MANUAL_REVIEW` | Confirmed work was not executable automatically |

A terminal status is not necessarily success. Preserve reasons and evidence.

## 9. Report and cleanup

Write and validate `.bug-hunter/fix-report.json`, then render its Markdown view.
Include:

- base/fix/original branch identity;
- exact files changed;
- per-bug status/reason/checkpoint;
- baseline/flaky/final verification comparison;
- circuit-breaker/deadline state;
- lock/worktree/stash cleanup and recovery state;
- manual-review and non-executable work.

Release the writer lock in final cleanup. Preserve any worktree, stash, or diff
whose safe restoration/removal cannot be proven.

When `LOOP_MODE=true`, `modes/fix-loop.md` may continue only pending executable
work. It must not retry manual-review or terminal failures merely to make every
finding read `FIXED`.
