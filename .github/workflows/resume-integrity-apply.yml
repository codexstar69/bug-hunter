name: Apply resume integrity hardening

on:
  push:
    branches:
      - loop/precision-bug-hunting-protocol

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'loop: apply resume integrity hardening'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply resume integrity patch
        run: node .loop/apply-resume-integrity.cjs

      - name: Verify syntax
        run: |
          node --check scripts/state-store.cjs
          node --check scripts/bug-hunter-state.cjs
          node --check scripts/chunk-scheduler.cjs
          node --check scripts/artifact-planner.cjs
          node --check scripts/run-bug-hunter.cjs

      - name: Run focused post-hardening regressions
        run: node --test scripts/tests/post-hardening-integrity.test.cjs

      - name: Run sealed completion gate
        run: bash .loop/check.sh

      - name: Record passing resume audit
        run: node .loop/apply-resume-integrity.cjs --record-pass

      - name: Remove temporary patch transport
        run: rm -f .loop/apply-resume-integrity.cjs .github/workflows/resume-integrity-apply.yml

      - name: Commit verified resume hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .loop/progress.md \
            .loop/journal.md \
            .loop/apply-resume-integrity.cjs \
            .github/workflows/resume-integrity-apply.yml \
            docs/precision-protocol.md \
            scripts/state-store.cjs \
            scripts/bug-hunter-state.cjs \
            scripts/chunk-scheduler.cjs \
            scripts/artifact-planner.cjs \
            scripts/run-bug-hunter.cjs
          git diff --cached --check
          git commit -m 'loop: iteration 17 - resume integrity hardening'
          git push origin HEAD:loop/precision-bug-hunting-protocol
