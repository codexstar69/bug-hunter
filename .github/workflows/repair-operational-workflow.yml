name: Execute operational hardening carrier

on:
  push:
    branches:
      - chore/world-class-freshness-pass

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/world-class-freshness-pass
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Execute carried product patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          carrier = Path('.github/workflows/world-class-operational-pass.yml').read_text(encoding='utf-8')
          match = re.search(
              r"^\s*python <<'PY'\n(?P<body>[\s\S]*?)^\s*PY\n",
              carrier,
              flags=re.MULTILINE,
          )
          if not match:
              raise SystemExit('embedded operational patch was not found')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in match.group('body').splitlines()
          ) + '\n'
          script = script.replace(
              "\nworkflow = Path('.github/workflows/world-class-operational-pass.yml')\nworkflow.unlink()\n",
              "\n",
          )
          exec(compile(script, 'operational-patch.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete Node 24 quality gate
        run: pnpm quality:world-class

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Run Node 22 compatibility gate
        run: |
          pnpm check:generated
          pnpm test
          node scripts/run-bug-hunter.cjs preflight --skill-dir .
          node bin/bug-hunter --version
          node bin/bug-hunter --help

      - name: Commit verified product files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            CHANGELOG.md \
            llms.txt \
            modes/persisted-chunks.md \
            modes/single-file.md \
            modes/small.md \
            modes/parallel.md \
            modes/extended.md \
            modes/scaled.md \
            modes/local-sequential.md \
            modes/loop.md \
            modes/loop-generic.md \
            modes/fix-loop.md \
            modes/large-codebase.md \
            modes/fix-pipeline.md \
            scripts/bug-hunter-state.cjs \
            scripts/chunk-scheduler.cjs \
            scripts/tests/persisted-chunk-integrity.test.cjs \
            scripts/tests/mode-contract.test.cjs
          git commit -m "chore: harden operational protocol [operational-pass-applied]"
          git push origin HEAD:chore/world-class-freshness-pass
