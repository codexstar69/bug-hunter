name: Apply measurable world-class protocol

on:
  push:
    branches:
      - loop/precision-bug-hunting-protocol

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'loop: apply measurable world-class protocol'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and extract implementation payload
        run: |
          cat .loop/world-class-payload/part-* | base64 --decode > /tmp/world-class-payload.tar.xz
          echo "PAYLOAD_SHA256  /tmp/world-class-payload.tar.xz" | sed "s/PAYLOAD_SHA256/${WORLD_CLASS_PAYLOAD_SHA256}/" | sha256sum --check
          tar -xJf /tmp/world-class-payload.tar.xz -C .
        env:
          WORLD_CLASS_PAYLOAD_SHA256: e8b4f9ba2551e6176451bca167eb2c8692ca3293a2fe7a49cc1e8a18c8f0d2fc

      - name: Apply runner and package integration
        run: node .loop/apply-world-class-core.cjs

      - name: Verify syntax
        run: |
          node --check scripts/benchmark-suite.cjs
          node --check scripts/adaptive-policy.cjs
          node --check scripts/hybrid-verifier.cjs
          node --check scripts/evidence-cache.cjs
          node --check scripts/retrieval-planner.cjs
          node --check scripts/chunk-scheduler.cjs
          node --check scripts/state-store.cjs
          node --check scripts/run-bug-hunter.cjs
          node --check scripts/tests/world-class-protocol.test.cjs

      - name: Regenerate runtime assets
        run: |
          pnpm generate:schema-validators
          pnpm generate:compat-prompts

      - name: Run focused world-class regressions
        run: node --test scripts/tests/world-class-protocol.test.cjs

      - name: Run sealed completion gate
        run: bash .loop/check.sh

      - name: Record sealed success
        run: node .loop/record-world-class-pass.cjs

      - name: Remove temporary transport
        run: rm -rf .loop/world-class-payload .loop/apply-world-class-core.cjs .loop/record-world-class-pass.cjs .github/workflows/world-class-apply.yml

      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .loop/progress.md \
            .loop/journal.md \
            .loop/world-class-payload \
            .loop/apply-world-class-core.cjs \
            .loop/record-world-class-pass.cjs \
            .github/workflows/world-class-apply.yml \
            .github/workflows/ci.yml \
            README.md \
            package.json \
            docs/world-class-protocol.md \
            evals/benchmark/public-manifest.json \
            evals/benchmark/private-labels.json \
            evals/benchmark/golden-runs.json \
            evals/benchmark/triage-sample.json \
            evals/benchmark/verification-plan.json \
            evals/benchmark/index-sample.json \
            evals/benchmark/hypotheses-sample.json \
            schemas/benchmark-report.schema.json \
            schemas/adaptive-plan.schema.json \
            schemas/verification-report.schema.json \
            schemas/retrieval-plan.schema.json \
            scripts/benchmark-suite.cjs \
            scripts/adaptive-policy.cjs \
            scripts/hybrid-verifier.cjs \
            scripts/evidence-cache.cjs \
            scripts/retrieval-planner.cjs \
            scripts/schema-catalog.cjs \
            scripts/generated-schema-validators.cjs \
            scripts/state-store.cjs \
            scripts/chunk-scheduler.cjs \
            scripts/run-bug-hunter.cjs \
            scripts/tests/world-class-protocol.test.cjs \
            scripts/tests/run-bug-hunter.test.cjs \
            skills/hunter/SKILL.md \
            prompts/hunter.md
          git diff --cached --check
          git commit -m 'loop: iteration 2 - measurable world-class protocol'
          git push origin HEAD:loop/precision-bug-hunting-protocol
