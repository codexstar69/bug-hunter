name: Apply deep precision hardening

on:
  push:
    branches:
      - loop/precision-bug-hunting-protocol

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'loop: apply deep precision hardening'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Correct patch transport function boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const patcher = '.loop/apply-deep-precision.cjs';
          let content = fs.readFileSync(patcher, 'utf8');
          const target = "function main() {\\n`" + "\n  );";
          const replacement = "`\n  );";
          if (!content.includes(target)) {
            throw new Error('deep patch transport boundary target not found');
          }
          content = content.replace(target, replacement);
          fs.writeFileSync(patcher, content, 'utf8');
          NODE

      - name: Apply deep precision patch
        run: node .loop/apply-deep-precision.cjs

      - name: Verify syntax
        run: |
          node --check scripts/source-config.cjs
          node --check scripts/triage.cjs
          node --check scripts/code-index.cjs
          node --check scripts/delta-mode.cjs
          node --check scripts/state-store.cjs
          node --check scripts/bug-hunter-state.cjs
          node --check scripts/chunk-scheduler.cjs
          node --check scripts/artifact-planner.cjs
          node --check scripts/run-bug-hunter.cjs

      - name: Regenerate runtime assets
        run: |
          pnpm generate:schema-validators
          pnpm generate:compat-prompts

      - name: Run focused deep regressions
        run: node --test scripts/tests/deep-precision-protocol.test.cjs

      - name: Run sealed completion gate
        run: bash .loop/check.sh

      - name: Record passing deep audit
        run: node .loop/apply-deep-precision.cjs --record-pass

      - name: Remove temporary patch transport
        run: rm -f .loop/apply-deep-precision.cjs .github/workflows/deep-apply.yml

      - name: Commit verified hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .loop/progress.md \
            .loop/journal.md \
            .loop/apply-deep-precision.cjs \
            .github/workflows/deep-apply.yml \
            docs/precision-protocol.md \
            scripts/source-config.cjs \
            scripts/triage.cjs \
            scripts/code-index.cjs \
            scripts/delta-mode.cjs \
            scripts/state-store.cjs \
            scripts/bug-hunter-state.cjs \
            scripts/chunk-scheduler.cjs \
            scripts/artifact-planner.cjs \
            scripts/run-bug-hunter.cjs \
            scripts/generated-schema-validators.cjs \
            prompts/hunter.md \
            prompts/skeptic.md
          git diff --cached --check
          git commit -m 'loop: iteration 12 - deep precision hardening'
          git push origin HEAD:loop/precision-bug-hunting-protocol
