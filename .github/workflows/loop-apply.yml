name: Apply precision protocol loop

on:
  push:
    branches:
      - loop/precision-bug-hunting-protocol

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'loop: retry precision regressions 1'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify sealed check hash
        run: |
          actual="$(sha256sum .loop/check.sh | awk '{print $1}')"
          expected="$(sed -n 's/^SHA-256: `\([a-f0-9]*\)`$/\1/p' .loop/task.md)"
          test -n "$expected"
          test "$actual" = "$expected"

      - name: Confirm the setup gate fails by assertion
        run: |
          set +e
          output="$(bash .loop/check.sh 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F 'ASSERTION FAILED: required precision-protocol file is missing: scripts/source-config.cjs'

      - name: Reconstruct and verify precision patcher
        run: |
          cat \
            .loop/patch-parts/part-00 \
            .loop/patch-parts/part-01 \
            .loop/patch-parts/part-020 \
            .loop/patch-parts/part-021 \
            .loop/patch-parts/part-022 \
            .loop/patch-parts/part-030 \
            .loop/patch-parts/part-031 \
            .loop/patch-parts/part-032 \
            .loop/patch-parts/part-040 \
            .loop/patch-parts/part-041 \
            .loop/patch-parts/part-042 \
            .loop/patch-parts/part-050 \
            .loop/patch-parts/part-051 \
            | base64 -d | gzip -d > /tmp/apply-precision-patches.cjs
          echo '50ad477d0fc84ae201acbe37781b6721e32cdff6e96a98e8ad1b6950a33d9c96  /tmp/apply-precision-patches.cjs' | sha256sum --check
          node --check /tmp/apply-precision-patches.cjs

      - name: Apply precision protocol changes
        run: node /tmp/apply-precision-patches.cjs

      - name: Regenerate runtime assets
        run: |
          pnpm generate:schema-validators
          pnpm generate:compat-prompts

      - name: Run sealed completion gate
        run: |
          set -o pipefail
          bash .loop/check.sh | tee /tmp/loop-check-output.txt

      - name: Record passing gate
        run: |
          {
            printf '\n## Iteration 6 — sealed completion gate — passed\n\n'
            printf 'The sealed `.loop/check.sh` exited 0: generated assets were current, all tests passed, preflight passed, and package inventory passed.\n'
          } >> .loop/journal.md

      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .loop/progress.md \
            .loop/journal.md \
            .loop/apply-precision-patches.cjs.gz.b64 \
            .loop/patch-parts \
            .github/workflows/loop-apply.yml \
            scripts/source-config.cjs \
            scripts/triage.cjs \
            scripts/code-index.cjs \
            scripts/bug-hunter-state.cjs \
            scripts/chunk-scheduler.cjs \
            scripts/run-bug-hunter.cjs \
            scripts/generated-schema-validators.cjs \
            scripts/tests/run-bug-hunter.test.cjs \
            scripts/tests/render-report.test.cjs \
            scripts/tests/precision-protocol.test.cjs \
            schemas/findings.schema.json \
            skills/hunter/SKILL.md \
            skills/skeptic/SKILL.md \
            prompts/hunter.md \
            prompts/skeptic.md \
            docs/precision-protocol.md \
            package.json \
            SKILL.md
          git diff --cached --check
          git commit -m 'loop: iteration 5 - precision-first bug hunting'
          git push origin HEAD:loop/precision-bug-hunting-protocol
