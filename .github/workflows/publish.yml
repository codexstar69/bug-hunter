name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Bind checkout to the release tag and main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match release tag $RELEASE_TAG"
            exit 1
          fi

          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          test "$(git rev-parse HEAD^{commit})" = \
            "$(git rev-parse refs/tags/$RELEASE_TAG^{commit})"
          git show-ref --verify refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = \
            "$(git rev-parse refs/remotes/origin/main^{commit})"
          git switch --force-create release-source --track origin/main

      - name: Use an OIDC-capable npm CLI
        run: |
          npm install --global npm@12.0.2
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated runtime assets
        run: pnpm check:generated

      - name: Run tests
        run: pnpm test

      - name: Run benchmark quality gate
        run: pnpm benchmark:gate

      - name: Run runtime preflight
        run: node scripts/run-bug-hunter.cjs preflight --skill-dir .

      - name: Inspect package inventory
        run: pnpm verify:package

      - name: Verify source provenance
        run: node scripts/prepublish-guard.cjs

      - name: Publish to npm
        run: npm publish --access public
