name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Bind checkout to release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_BRANCH: ${{ github.event.release.target_commitish }}
        run: |
          git check-ref-format --branch "$TARGET_BRANCH"
          git show-ref --verify "refs/remotes/origin/$TARGET_BRANCH"
          git switch --force-create release-source --track "origin/$TARGET_BRANCH"

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match release tag $RELEASE_TAG"
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          test "$(git rev-parse HEAD^{commit})" = \
            "$(git rev-parse refs/tags/$RELEASE_TAG^{commit})"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Verify source provenance
        run: node scripts/prepublish-guard.cjs

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
